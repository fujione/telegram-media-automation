[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-media-automation"
version = "0.1.0rc4"
description = "Independent Telegram-first media search, download and automation service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
telegram = [
  "python-socks[asyncio]>=2.7,<3",
  "telethon>=1.40,<2",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
mediactl = "telegram_media_automation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_media_automation"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs/HANDOFF.md", "/docs/deployments", "/docs/diagnostics"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["telegram_media_automation"]
