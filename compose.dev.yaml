name: telegram-media-automation

x-app: &app
  build:
    context: .
    args:
      PYTHON_IMAGE: ${TMA_PYTHON_IMAGE:-python:3.12-slim}
      UV_IMAGE: ${TMA_UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.5}
  restart: unless-stopped
  user: "${TMA_UID:-10001}:${TMA_GID:-10001}"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  env_file: .env
  volumes:
    - ${TMA_HOST_DATA_DIR:-./data}:/data
    - ${TMA_HOST_BACKUP_DIR:-./data/backups}:/backups
    - ${TMA_HOST_INCOMPLETE_DIR:-./downloads/incomplete}:/downloads/incomplete
    - ${TMA_HOST_INBOX_DIR:-./downloads/inbox}:/downloads/inbox
    - ${TMA_HOST_MOVIE_DIR:-./media/movies}:/media/movies
    - ${TMA_HOST_TV_DIR:-./media/tv}:/media/tv
    - ./secrets:/run/secrets:ro

services:
  api:
    <<: *app
    ports:
      - "${TMA_BIND_ADDRESS:-127.0.0.1}:${TMA_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
