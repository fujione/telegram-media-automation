name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=telegram_media_automation --cov-report=term-missing --cov-fail-under=80
      - run: node --check src/telegram_media_automation/web/app.js
      - run: node --check src/telegram_media_automation/web/workspace.js
      - run: node --test tests/web_workspace.test.cjs
      - run: node --test tests/web_replacement.test.cjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv run python scripts/check_web_workspace.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: dist/webui-review/
      - run: uv build
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - run: >-
          uv export --locked --no-dev --extra telegram --format cyclonedx1.5
          --preview-features sbom-export --no-emit-project
          --output-file build-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: build-sbom.cdx.json
      - run: docker build --tag telegram-media-automation:test .
      - name: Read-only container smoke test
        run: |
          test "$(docker run --rm --entrypoint id telegram-media-automation:test -u)" = "10001"
          docker run --detach --name telegram-media-smoke --read-only \
            --tmpfs /data:uid=10001 --tmpfs /downloads:uid=10001 --tmpfs /media:uid=10001 \
            --env APP_API_TOKEN=smoke-secret --env APP_WORKERS_ENABLED=false \
            --publish 18080:8080 telegram-media-automation:test
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/health/live; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18080/health/live
        shell: bash
      - name: Container logs
        if: always()
        run: docker logs telegram-media-smoke || true
      - name: Remove smoke container
        if: always()
        run: docker rm --force telegram-media-smoke || true
      - name: Public Compose first-run and restart acceptance
        # The public first-run Compose is checked with fresh named volumes and
        # an internal network, using fixture credentials only.
        run: bash scripts/check_docker_first_run.sh
      - name: Export verified candidate image
        run: |
          mkdir -p dist/container
          docker tag telegram-media-automation:test telegram-media-automation:candidate-${{ github.sha }}
          docker save telegram-media-automation:candidate-${{ github.sha }} | gzip -1 > dist/container/image.tar.gz
          cd dist/container
          sha256sum image.tar.gz > SHA256SUMS
      - name: Verify exported archive configuration and layers
        run: |
          export CANDIDATE_ID="$(docker image inspect --format '{{.Id}}' telegram-media-automation:test)"
          uv run python - <<'PY'
          import os, runpy
          from pathlib import Path
          runpy.run_path('scripts/prepare_release.py')['validate_image_archive'](
              Path('dist/container/image.tar.gz'), image_id=os.environ['CANDIDATE_ID'],
              image='telegram-media-automation:candidate-' + os.environ['GITHUB_SHA'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-container
          path: dist/container/
          compression-level: 0
          retention-days: 1
